<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b3d62">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kana Umi – Belajar Hiragana & Katakana</title>
<style>
:root{--t:#eaf6fb;--t2:#a9d3e3;--card:#fdfaf3;--ink:#16324a;--accent:#f26b3a;--panel:rgba(8,40,66,.55);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#e9eef2}}
:root[data-theme="dark"]{--card:#e9eef2}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--t);
background:linear-gradient(#2a8fb8 0%,#14658f 35%,#0b3d62 70%,#06233d 100%) fixed;overflow-x:hidden}
#sea{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.fish{position:absolute;left:-120px;width:90px;height:40px;animation:swim linear infinite}
.fish.rtl{left:auto;right:-120px;animation-name:swimr}
.fish svg{width:100%;height:100%;animation:wob 1.4s ease-in-out infinite}
@keyframes swim{to{transform:translateX(calc(100vw + 260px))}}
@keyframes swimr{to{transform:translateX(calc(-100vw - 260px))}}
@keyframes wob{50%{transform:translateY(-6px) rotate(3deg)}}
.bub{position:absolute;bottom:-20px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-110vh)}}
.wrap{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:18px 16px 28px}
h1{font-size:22px;margin:4px 0 2px;text-align:center}
.sub{text-align:center;color:var(--t2);font-size:13px;margin-bottom:14px}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.tabs button{grid-column:span 2;padding:10px 4px;font-size:14px;border:1px solid rgba(255,255,255,.45);border-radius:999px;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.45),rgba(255,255,255,.1) 55%,rgba(110,200,230,.2));color:var(--t);box-shadow:inset 0 -3px 6px rgba(0,60,100,.3),0 2px 6px rgba(0,0,0,.25);backdrop-filter:blur(3px);cursor:pointer;transition:transform .12s,filter .12s}
.tabs button:nth-child(n+4){grid-column:span 3}
button:hover{filter:brightness(1.12)}button:active{transform:scale(.95)}
.tabs button.on,.ctrl button.main{background:linear-gradient(135deg,#ffa263,#f26b3a);border-color:#ffd6bd;color:#fff;font-weight:600}
.info{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 8px;font-size:13px;color:var(--t2)}
.bar{height:6px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden;margin:0 2px 14px}
.bar i{display:block;height:100%;width:0;background:#7be0b0;transition:width .3s}
.scene{perspective:1000px;height:270px;cursor:pointer}
.card{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;background:var(--card);color:var(--ink);
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 28px rgba(0,0,0,.35);padding:16px;text-align:center;border:3px solid #fff}
.face.back{transform:rotateY(180deg);background:#fff4e6}
.big{font-size:96px;line-height:1.1}
.big.word{font-size:56px}
.rom{font-size:44px;font-weight:700;color:var(--accent)}
.mean{font-size:20px}
.hint{font-size:12px;color:#6b8296}
.tag{position:absolute;top:12px;left:14px;font-size:11px;background:#d9ecf5;color:var(--ink);padding:3px 9px;border-radius:20px}
.ctrl{display:flex;gap:8px;margin-top:16px}
.ctrl button{flex:1;padding:13px 6px;font-size:14px;border:1px solid rgba(255,255,255,.45);border-radius:999px;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.45),rgba(255,255,255,.1) 55%,rgba(110,200,230,.2));color:var(--t);box-shadow:inset 0 -3px 6px rgba(0,60,100,.3),0 2px 6px rgba(0,0,0,.25);backdrop-filter:blur(3px);cursor:pointer;transition:transform .12s,filter .12s}
.ctrl button.ok{background:linear-gradient(135deg,#4fd1a0,#1f8f66);border-color:#b9f0d9;color:#fff}
.ctrl button.ok.done{background:linear-gradient(135deg,#a8f0cf,#6fd6a8);color:#06233d;font-weight:600}
.opts{display:flex;gap:8px;margin-top:10px}
.opts button{flex:1;padding:8px 4px;font-size:12.5px;border:1px solid rgba(255,255,255,.45);border-radius:999px;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.45),rgba(255,255,255,.1) 55%,rgba(110,200,230,.2));color:var(--t);box-shadow:inset 0 -3px 6px rgba(0,60,100,.3),0 2px 6px rgba(0,0,0,.25);backdrop-filter:blur(3px);cursor:pointer;transition:transform .12s,filter .12s}
.opts button.on{background:linear-gradient(135deg,#5fd0e8,#1b8fb5);border-color:#d3f4fb;color:#fff;font-weight:600}
</style>
</head>
<body>
<div id="sea">
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="koi" viewBox="0 0 90 40">
<path d="M8 20 C22 2 55 2 72 18 L88 6 C84 15 84 25 88 34 L72 22 C55 38 22 38 8 20Z" fill="var(--c,#f26b3a)"/>
<path d="M28 9 C38 3 50 5 56 12 C46 10 36 11 28 9Z" fill="#fff" opacity=".85"/>
<path d="M34 31 C42 36 52 35 58 29 C50 30 42 30 34 31Z" fill="#fff" opacity=".6"/>
<circle cx="20" cy="17" r="2.2" fill="#16324a"/>
</symbol></defs></svg>
</div>
<div class="wrap">
<h1>🐟 Kana Umi</h1>
<div class="sub">Belajar Hiragana, Katakana &amp; kosakata</div>
<div class="tabs" id="tabs">
<button data-m="hira" class="on">ひらがな</button>
<button data-m="kata">カタカナ</button>
<button data-m="vocab">Kosakata</button>
<button data-m="dhira">が Dakuten</button>
<button data-m="dkata">ガ Dakuten</button>
</div>
<div class="opts" id="vf" style="display:none"><button data-f="all" class="on">Semua</button><button data-f="hira">Hiragana</button><button data-f="kata">Katakana</button><button data-f="dak">Dakuten</button></div>
<div class="info"><span id="cnt"></span><span id="known"></span></div>
<div class="bar"><i id="pg"></i></div>
<div class="scene" id="scene"><div class="card" id="card">
<div class="face front"><span class="tag" id="tagF"></span><div class="big" id="fk"></div><div class="hint">Ketuk untuk membalik</div></div>
<div class="face back"><span class="tag" id="tagB"></span><div class="rom" id="br"></div><div class="mean" id="bm"></div></div>
</div></div>
<div class="ctrl">
<button id="prev">← Sebelumnya</button>
<button id="ok" class="ok">✓ Hafal</button>
<button id="next" class="main">Berikutnya →</button>
</div>
<div class="opts">
<button id="shuf">🔀 Acak</button>
<button id="unk">Hanya belum hafal</button>
<button id="rst">Reset</button>
</div>
</div>
<script>
var H="あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん".split("");
var R="a i u e o ka ki ku ke ko sa shi su se so ta chi tsu te to na ni nu ne no ha hi fu he ho ma mi mu me mo ya yu yo ra ri ru re ro wa wo n".split(" ");
var DH="がぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽ".split("");
var DR="ga gi gu ge go za ji zu ze zo da ji zu de do ba bi bu be bo pa pi pu pe po".split(" ");
function kt(c){return String.fromCharCode(c.charCodeAt(0)+96)}
var KT=/[ァ-ヺー]/,DK=/[がぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽガギグゲゴザジズゼゾダヂヅデドバビブベボパピプペポ]/;
function mk(a,r,m){return a.map(function(c,i){return{k:c,r:r[i],m:m}})}
function P(s){return s.split(";").map(function(x){var v=x.split("|");return{k:v[0],r:v[1],m:v[2],w:1}})}
var D={hira:mk(H,R,"Hiragana"),kata:mk(H.map(kt),R,"Katakana"),
dhira:mk(DH,DR,"Hiragana · Dakuten"),dkata:mk(DH.map(kt),DR,"Katakana · Dakuten"),
vocab:P("ねこ|neko|kucing;いぬ|inu|anjing;さかな|sakana|ikan;みず|mizu|air;うみ|umi|laut;そら|sora|langit;はな|hana|bunga;さくら|sakura|bunga sakura;たべる|taberu|makan;のむ|nomu|minum;ありがとう|arigatou|terima kasih;おはよう|ohayou|selamat pagi;こんにちは|konnichiwa|selamat siang;さようなら|sayounara|selamat tinggal;ひと|hito|orang;ほん|hon|buku;くるま|kuruma|mobil;やま|yama|gunung;かわ|kawa|sungai;つき|tsuki|bulan;あめ|ame|hujan;ゆき|yuki|salju;とり|tori|burung;まち|machi|kota;いえ|ie|rumah;みせ|mise|toko;あさ|asa|pagi;よる|yoru|malam;なまえ|namae|nama;すし|sushi|sushi;おかね|okane|uang;うれしい|ureshii|senang;あかい|akai|merah;しろい|shiroi|putih;おおきい|ookii|besar;ちいさい|chiisai|kecil;がっこう|gakkou|sekolah;ともだち|tomodachi|teman;でんしゃ|densha|kereta;ごはん|gohan|nasi / makanan;かぞく|kazoku|keluarga;かばん|kaban|tas;ぎんこう|ginkou|bank;おにぎり|onigiri|nasi kepal;だいがく|daigaku|universitas;くだもの|kudamono|buah;ぶた|buta|babi;かぜ|kaze|angin;ざっし|zasshi|majalah;ばら|bara|mawar;でぐち|deguchi|pintu keluar;おんがく|ongaku|musik;ぞう|zou|gajah;てがみ|tegami|surat;えんぴつ|enpitsu|pensil;さんぽ|sanpo|jalan-jalan;きっぷ|kippu|tiket;じてんしゃ|jitensha|sepeda;ばしょ|basho|tempat;ぼうし|boushi|topi;ひゃくえん|hyakuen|100 yen;コーヒー|koohii|kopi;ケーキ|keeki|kue;アイス|aisu|es krim;ラーメン|raamen|ramen;カメラ|kamera|kamera;ホテル|hoteru|hotel;タクシー|takushii|taksi;ミルク|miruku|susu;メニュー|menyuu|menu;スマホ|sumaho|ponsel;ナイフ|naifu|pisau;フォーク|fooku|garpu;スプーン|supuun|sendok;レストラン|resutoran|restoran;サッカー|sakkaa|sepak bola;テニス|tenisu|tenis;ノート|nooto|buku catatan;アメリカ|amerika|Amerika;インドネシア|indoneshia|Indonesia;ニュース|nyuusu|berita;メール|meeru|email;セーター|seetaa|sweter;トイレ|toire|toilet;ラジオ|rajio|radio;テーブル|teeburu|meja;テレビ|terebi|televisi;ギター|gitaa|gitar;ジュース|juusu|jus;ビール|biiru|bir;パン|pan|roti;ピアノ|piano|piano;ペン|pen|pena;ドア|doa|pintu;バス|basu|bus;ベッド|beddo|tempat tidur;ゲーム|geemu|permainan;ガイド|gaido|pemandu;デパート|depaato|pusat perbelanjaan;バナナ|banana|pisang;ポスト|posuto|kotak pos;プール|puuru|kolam renang;パソコン|pasokon|komputer;ハンバーガー|hanbaagaa|hamburger;ピザ|piza|pizza;ズボン|zubon|celana;ドラマ|dorama|drama;ゴルフ|gorufu|golf;バイク|baiku|motor;ビデオ|bideo|video;ダンス|dansu|tari;ガソリン|gasorin|bensin;アルバイト|arubaito|kerja paruh waktu")};
var vfil="all";
function vm(x){return vfil==="dak"?DK.test(x.k):vfil==="kata"?KT.test(x.k):vfil==="hira"?!KT.test(x.k):true}
var mode="hira",idx=0,list=[],onlyUnk=false,shuffled=false,known={};
try{known=JSON.parse(localStorage.getItem("kana-umi")||"{}")}catch(e){}
function save(){try{localStorage.setItem("kana-umi",JSON.stringify(known))}catch(e){}}
function $(i){return document.getElementById(i)}
function key(it){return mode+":"+it.k}
function build(){
 var base=D[mode].slice();if(mode==="vocab")base=base.filter(vm);
 if(onlyUnk)base=base.filter(function(x){return !known[key(x)]});
 if(shuffled)base.sort(function(){return Math.random()-.5});
 list=base;if(idx>=list.length)idx=0;render();
}
function render(){
 var all=D[mode],kc=all.filter(function(x){return known[key(x)]}).length;
 $("known").textContent="Hafal "+kc+"/"+all.length;
 $("pg").style.width=(kc/all.length*100)+"%";
 if(!list.length){$("cnt").textContent="Semua sudah hafal 🎉";$("fk").textContent="🎉";$("br").textContent="";$("bm").textContent="";return}
 var it=list[idx];
 $("cnt").textContent="Kartu "+(idx+1)+" / "+list.length;
 $("card").classList.remove("flip");
 $("fk").textContent=it.k;$("fk").className="big"+(it.w?" word":"");$("fk").style.fontSize=it.w?(it.k.length>6?"34px":it.k.length>4?"42px":it.k.length>2?"52px":"64px"):"";
 var tag=it.w?((KT.test(it.k)?"Katakana":"Hiragana")+(DK.test(it.k)?" · Dakuten":"")):it.m;
 $("tagF").textContent=tag;$("tagB").textContent=tag;
 $("br").textContent=it.r;$("bm").textContent=it.w?it.m:"";
 var o=$("ok");o.textContent=known[key(it)]?"✓ Sudah hafal":"✓ Hafal";o.classList.toggle("done",!!known[key(it)]);
}
function go(d){if(!list.length)return;idx=(idx+d+list.length)%list.length;render()}
$("scene").onclick=function(){$("card").classList.toggle("flip")};
$("next").onclick=function(){go(1)};$("prev").onclick=function(){go(-1)};
$("ok").onclick=function(){if(!list.length)return;var k=key(list[idx]);if(known[k])delete known[k];else known[k]=1;save();
 if(onlyUnk&&known[k]){list.splice(idx,1);if(idx>=list.length)idx=0}else if(!known[k]||!onlyUnk){idx=(idx+1)%list.length}
 render()};
$("shuf").onclick=function(){shuffled=!shuffled;this.classList.toggle("on",shuffled);idx=0;build()};
$("unk").onclick=function(){onlyUnk=!onlyUnk;this.classList.toggle("on",onlyUnk);idx=0;build()};
$("rst").onclick=function(){if(confirm("Hapus semua progres hafalan?")){known={};save();idx=0;build()}};
$("tabs").onclick=function(e){var m=e.target.getAttribute("data-m");if(!m)return;mode=m;idx=0;$("vf").style.display=m==="vocab"?"flex":"none";
 Array.prototype.forEach.call(this.children,function(b){b.classList.toggle("on",b===e.target)});build()};
document.addEventListener("keydown",function(e){
 if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);else if(e.key===" "){e.preventDefault();$("scene").click()}});
/* laut: ikan koi & gelembung */
(function(){
 var sea=$("sea"),cols=["#f26b3a","#f5f0e6","#e8452c","#f7b733","#fff"];
 for(var i=0;i<7;i++){
  var f=document.createElement("div"),rtl=i%2===1,s=.6+Math.random()*.9;
  f.className="fish"+(rtl?" rtl":"");
  f.style.top=(8+Math.random()*80)+"%";
  f.style.width=(90*s)+"px";f.style.height=(40*s)+"px";
  f.style.animationDuration=(18+Math.random()*22)+"s";
  f.style.animationDelay=(-Math.random()*30)+"s";
  f.style.opacity=.55+Math.random()*.4;
  f.innerHTML='<svg style="--c:'+cols[i%cols.length]+(rtl?';transform:scaleX(-1)':'')+'"><use href="#koi"/></svg>';
  sea.appendChild(f);
 }
 for(var j=0;j<14;j++){
  var b=document.createElement("div"),z=4+Math.random()*10;
  b.className="bub";b.style.cssText="left:"+Math.random()*100+"%;width:"+z+"px;height:"+z+"px;animation-duration:"+(8+Math.random()*12)+"s;animation-delay:"+(-Math.random()*15)+"s";
  sea.appendChild(b);
 }
})();
$("vf").onclick=function(e){var f=e.target.getAttribute("data-f");if(!f)return;vfil=f;idx=0;
 Array.prototype.forEach.call(this.children,function(b){b.classList.toggle("on",b===e.target)});build()};
build();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
